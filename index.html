<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcrição Forense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d26;
    --surface2: #222533;
    --border: #2e3145;
    --border-strong: #3d4160;
    --text: #e8eaf0;
    --text-sec: #8b90a8;
    --text-muted: #555a72;
    --accent: #00c9a7;
    --accent-dim: rgba(0,201,167,0.12);
    --accent-border: rgba(0,201,167,0.35);
    --red: #e05c5c;
    --red-dim: rgba(224,92,92,0.12);
    --red-border: rgba(224,92,92,0.35);
    --blue: #5b8dee;
    --blue-dim: rgba(91,141,238,0.12);
    --blue-border: rgba(91,141,238,0.3);
    --radius: 8px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 780px;
    margin: 0 auto;
    padding: 0 0 40px;
  }

  header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-title {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
  }

  .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 500;
    border: 1px solid var(--accent-border);
    letter-spacing: 0.04em;
  }

  .api-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .api-label {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .api-input {
    font-family: var(--mono);
    font-size: 12px;
    height: 32px;
    width: 200px;
    padding: 0 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }

  .api-input:focus { border-color: var(--accent); }

  .context-section {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .context-label {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .context-input {
    font-family: var(--sans);
    font-size: 12px;
    flex: 1;
    height: 34px;
    padding: 0 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }

  .context-input:focus { border-color: var(--accent); }

  .controls {
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .btn-record {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 18px;
    height: 40px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--sans);
    white-space: nowrap;
    transition: background 0.15s;
  }

  .btn-record:hover { background: var(--surface); }

  .btn-record.active {
    background: var(--red-dim);
    border-color: var(--red-border);
    color: var(--red);
  }

  .rec-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }

  .btn-record.active .rec-dot {
    background: var(--red);
    animation: blink 1s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .canvas-wrap { flex: 1; min-width: 80px; }

  canvas {
    width: 100%;
    height: 32px;
    display: block;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .silence-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .silence-label { font-size: 11px; color: var(--text-muted); }

  input[type=range] {
    width: 70px;
    accent-color: var(--accent);
  }

  .silence-val {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-sec);
    min-width: 28px;
  }

  .status-pill {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    white-space: nowrap;
  }

  .status-pill.listening { color: var(--red); border-color: var(--red-border); background: var(--red-dim); }
  .status-pill.processing { color: var(--blue); border-color: var(--blue-border); background: var(--blue-dim); }
  .status-pill.ready { color: var(--accent); border-color: var(--accent-border); background: var(--accent-dim); }

  .transcript-area {
    flex: 1;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 280px;
  }

  .empty-msg {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    margin: 40px auto;
    line-height: 1.8;
  }

  .entry {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    animation: fadein 0.2s ease;
  }

  @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

  .entry.processing {
    border-color: var(--blue-border);
    background: var(--blue-dim);
  }

  .entry-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    padding-top: 3px;
    min-width: 20px;
    user-select: none;
  }

  .entry-text {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    line-height: 1.65;
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    width: 100%;
  }

  .entry.processing .entry-text {
    color: var(--blue);
    font-style: italic;
  }

  .entry-del {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s;
    font-family: var(--sans);
  }

  .entry:hover .entry-del { opacity: 1; }
  .entry-del:hover { color: var(--red); }

  footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: auto;
  }

  .footer-left { display: flex; gap: 8px; }

  .btn-sm {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--surface2);
    color: var(--text-sec);
    cursor: pointer;
    font-family: var(--sans);
  }

  .btn-sm:hover { background: var(--surface); color: var(--text); }
  .btn-sm.danger:hover { color: var(--red); border-color: var(--red-border); }

  .count { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span style="font-size:18px">🩺</span>
    <span class="app-title">Transcrição Forense</span>
    <span class="badge">PROTO v1</span>
  </div>
  <div class="api-row">
    <span class="api-label">Groq API key</span>
    <input type="password" class="api-input" id="apiKey" placeholder="gsk_..." autocomplete="off">
  </div>
</header>

<div class="context-section">
  <span class="context-label">Contexto</span>
  <input type="text" class="context-input" id="contextInput"
    value="Exame necroscópico médico-legal. Terminologia: equimose, petéquia, sufusão hemorrágica, lividez cadavérica, rigidez, putrefação, hipostasia, solução de continuidade, ferida contusa, ferida incisa, trajeto do projétil, fratura, hematoma epidural, subdural, subaracnóideo.">
</div>

<div class="controls">
  <button class="btn-record" id="btnRecord" onclick="toggleRecording()">
    <span class="rec-dot" id="recDot"></span>
    <span id="btnLabel">Iniciar gravação</span>
  </button>
  <div class="canvas-wrap">
    <canvas id="waveCanvas"></canvas>
  </div>
  <div class="silence-row">
    <span class="silence-label">Pausa:</span>
    <input type="range" min="1" max="5" step="0.5" value="2" id="silenceSlider"
      oninput="document.getElementById('silenceVal').textContent=this.value+'s'">
    <span class="silence-val" id="silenceVal">2s</span>
  </div>
  <span class="status-pill" id="statusPill">aguardando</span>
</div>

<div class="transcript-area" id="transcriptArea">
  <div class="empty-msg" id="emptyMsg">
    🎙️<br><br>
    Cole a chave Groq e toque em "Iniciar gravação".<br>
    O texto aparece após cada pausa.
  </div>
</div>

<footer>
  <div class="footer-left">
    <button class="btn-sm" onclick="copyAll()">⎘ Copiar tudo</button>
    <button class="btn-sm danger" onclick="clearAll()">✕ Limpar</button>
  </div>
  <span class="count" id="entryCount">0 entradas</span>
</footer>

<script>
let mediaRecorder = null;
let audioContext = null;
let analyser = null;
let sourceNode = null;
let chunks = [];
let silenceTimer = null;
let isRecording = false;
let entryIndex = 0;
let animFrame = null;
let activeStream = null;

const canvas = document.getElementById('waveCanvas');
const ctx2d = canvas.getContext('2d');

function getApiKey() { return document.getElementById('apiKey').value.trim(); }
function getCtxPrompt() { return document.getElementById('contextInput').value.trim(); }
function getSilenceMs() { return parseFloat(document.getElementById('silenceSlider').value) * 1000; }

function setStatus(text, cls) {
  const p = document.getElementById('statusPill');
  p.textContent = text;
  p.className = 'status-pill' + (cls ? ' ' + cls : '');
}

function drawWave() {
  if (!analyser) return;
  animFrame = requestAnimationFrame(drawWave);
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (canvas.width !== W) canvas.width = W;
  canvas.height = H;
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(buf);
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.strokeStyle = isRecording ? '#e05c5c' : '#555a72';
  ctx2d.lineWidth = 1.5;
  ctx2d.beginPath();
  const sl = W / buf.length;
  for (let i = 0; i < buf.length; i++) {
    const x = i * sl;
    const y = ((buf[i] / 128.0) - 1.0) * (H / 2) + H / 2;
    i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
  }
  ctx2d.stroke();
}

function getRMS() {
  if (!analyser) return 0;
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) {
    const v = (buf[i] / 128.0) - 1.0;
    sum += v * v;
  }
  return Math.sqrt(sum / buf.length);
}

async function toggleRecording() {
  if (!isRecording) await startRecording();
  else stopAll();
}

async function startRecording() {
  const key = getApiKey();
  if (!key || !key.startsWith('gsk_')) {
    alert('Cole uma chave de API Groq válida (começa com gsk_).');
    return;
  }
  try {
    activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new AudioContext();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    sourceNode = audioContext.createMediaStreamSource(activeStream);
    sourceNode.connect(analyser);

    isRecording = true;
    document.getElementById('btnRecord').classList.add('active');
    document.getElementById('btnLabel').textContent = 'Parar';
    setStatus('gravando', 'listening');
    drawWave();
    startSegment();
    monitorSilence();
  } catch(e) {
    alert('Sem acesso ao microfone.\n' + e.message);
  }
}

function startSegment() {
  if (!isRecording || !activeStream) return;
  chunks = [];
  try {
    mediaRecorder = new MediaRecorder(activeStream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = handleSegmentEnd;
    mediaRecorder.start(100);
  } catch(e) {
    try {
      mediaRecorder = new MediaRecorder(activeStream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = handleSegmentEnd;
      mediaRecorder.start(100);
    } catch(e2) {}
  }
}

function stopAll() {
  isRecording = false;
  clearTimeout(silenceTimer);
  silenceTimer = null;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (activeStream) { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; }
  if (audioContext) { audioContext.close(); audioContext = null; }
  analyser = null;
  sourceNode = null;
  document.getElementById('btnRecord').classList.remove('active');
  document.getElementById('btnLabel').textContent = 'Iniciar gravação';
  setStatus('aguardando');
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
}

function monitorSilence() {
  if (!isRecording) return;
  const rms = getRMS();
  if (rms < 0.012) {
    if (!silenceTimer) {
      silenceTimer = setTimeout(() => {
        silenceTimer = null;
        if (isRecording && mediaRecorder && mediaRecorder.state === 'recording' && chunks.length > 0) {
          setStatus('processando...', 'processing');
          mediaRecorder.stop();
        }
      }, getSilenceMs());
    }
  } else {
    if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
    if (isRecording) setStatus('gravando', 'listening');
  }
  setTimeout(monitorSilence, 80);
}

async function handleSegmentEnd() {
  if (chunks.length === 0) { if (isRecording) startSegment(); return; }
  const blob = new Blob(chunks, { type: 'audio/webm' });
  chunks = [];
  if (blob.size < 3000) { if (isRecording) startSegment(); return; }

  const idx = ++entryIndex;
  addProcessingEntry(idx);

  const fd = new FormData();
  fd.append('file', blob, 'audio.webm');
  fd.append('model', 'whisper-large-v3');
  fd.append('language', 'pt');
  fd.append('response_format', 'json');
  const cp = getCtxPrompt();
  if (cp) fd.append('prompt', cp);

  try {
    const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getApiKey() },
      body: fd
    });
    const data = await res.json();
    const text = (data.text || '').trim();
    if (text.length > 2) updateEntry(idx, text);
    else removeEntry(idx);
  } catch(e) {
    updateEntry(idx, '[erro: ' + e.message + ']');
  }

  if (isRecording) {
    setStatus('gravando', 'listening');
    startSegment();
  }
}

function addProcessingEntry(idx) {
  document.getElementById('emptyMsg')?.remove();
  const area = document.getElementById('transcriptArea');
  const div = document.createElement('div');
  div.className = 'entry processing';
  div.id = 'e' + idx;
  div.innerHTML = `<span class="entry-num">${idx}</span><span class="entry-text">transcrevendo...</span>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  updateCount();
}

function updateEntry(idx, text) {
  const div = document.getElementById('e' + idx);
  if (!div) return;
  div.className = 'entry';
  div.innerHTML = `
    <span class="entry-num">${idx}</span>
    <textarea class="entry-text" rows="2" spellcheck="false">${text}</textarea>
    <button class="entry-del" onclick="removeEntry(${idx})" title="remover">✕</button>
  `;
  const ta = div.querySelector('textarea');
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  document.getElementById('transcriptArea').scrollTop = 99999;
  updateCount();
}

function removeEntry(idx) {
  document.getElementById('e' + idx)?.remove();
  updateCount();
}

function updateCount() {
  const n = document.querySelectorAll('.entry:not(.processing)').length;
  document.getElementById('entryCount').textContent = n + (n === 1 ? ' entrada' : ' entradas');
}

function copyAll() {
  const texts = [...document.querySelectorAll('.entry textarea')].map(t => t.value).filter(Boolean).join('\n\n');
  if (!texts) return;
  navigator.clipboard.writeText(texts).then(() => {
    const btn = document.querySelector('[onclick="copyAll()"]');
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado!';
    setTimeout(() => { btn.textContent = orig; }, 1800);
  });
}

function clearAll() {
  if (!confirm('Limpar todas as entradas?')) return;
  document.getElementById('transcriptArea').innerHTML =
    '<div class="empty-msg" id="emptyMsg">🎙️<br><br>Cole a chave Groq e toque em "Iniciar gravação".<br>O texto aparece após cada pausa.</div>';
  entryIndex = 0;
  updateCount();
}
</script>
</body>
</html>
